<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clearly</title>
  <meta name="description" content="סיכום לכל שיעור, דף נוסחאות ומבחן קצר. גרסת בדיקה.">
  <meta name="theme-color" content="#F7F9FE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clearly">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // מי שלא מחובר/ת רואה את דף הפתיחה (welcome) כדף הראשי.
    // נשארים באפליקציה: אחרי התחברות, מכפתור "לאפליקציה" (?app=1), בקישור ממייל (אימות / איפוס סיסמה),
    // ובקישור ישיר למסך מסוים (כמו #legal-privacy).
    try {
      var loggedIn = !!localStorage.getItem("sikumon-auth");
      var fromLanding = /[?&]app=1/.test(location.search);
      var fromMail = /access_token|error_description|type=recovery/.test(location.hash) || /[?&](code|token_hash|type)=/.test(location.search);
      var deepLink = location.hash && location.hash !== "#home";
      if (!loggedIn && !fromLanding && !fromMail && !deepLink) location.replace("welcome/");
    } catch (e) { /* בלי גישה לאחסון – נשארים באפליקציה */ }
  </script>
</head>
<body>
  <a class="skip-link" href="#" onclick="event.preventDefault(); document.getElementById('view').focus();">דילוג לתוכן</a>
  <div class="app">
    <aside class="side" aria-label="ניווט ראשי">
      <a class="brand" href="#home">
        <img src="icons/logo-mark.png" alt="" width="32" height="32">
        <span>Clearly</span>
      </a>
      <nav class="tabs" id="tabs"></nav>
      <p class="beta">גרסת בדיקה</p>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
